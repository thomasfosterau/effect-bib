# Every external version lives here; package.json files reference only
# `catalog:`, `catalog:peers` or `workspace:*`. After editing, run `vp install`
# and commit pnpm-lock.yaml.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Depends on `effect`, which the override forces onto the catalog singleton,
  # so it moves with the `effect` entry.
  "@effect/docgen": ^4.1.6
  "@effect/language-service": ^0.87.5
  # `effect-tsgo patch` (in `prepare`) supports only the `@typescript/native`,
  # oxlint and tsrs versions in the `components` table of
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs, and fails the install
  # otherwise: move it, `@typescript/native` and `vite-plus` together.
  "@effect/tsgo": 0.73.4
  "@effect/vitest": 4.1.6
  "@enfect/oxlint": ^0.10.0
  # The dev pin; the published range is in `catalogs.peers`.
  "@thomasfosterau/effect-parse": 0.6.2
  "@types/node": ^26.6.11
  # Must equal the `vitest` vite-plus pins, or `vp test --coverage` refuses
  # to start.
  "@vitest/coverage-istanbul": 5.1.1
  effect: 4.1.6
  fallow: 3.48.0
  # TS7 (`tsc`, native) type-checks and emits `dist/`; the TS6 alias serves
  # the JS-API consumers (the language service, docgen). Exact pins: see the
  # @effect/tsgo note.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite`, `vitest` and `@vitest/coverage-istanbul` equal what vite-plus
  # itself depends on (`npm view vite-plus@<v> dependencies`); `vite` no longer
  # equals vite-plus.
  vite-plus: 1.8.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1

# Published peer ranges. `effect` stays `^4.0.0` unless a dependency needs
# newer (name it here). Each floor is proved by running the gates with the
# dev pin set to it; widen the effect-parse range (with a changeset) once a new
# minor passes.
catalogs:
  peers:
    "@thomasfosterau/effect-parse": ^0.4.1 || ^0.5.0
    effect: ^4.0.0

overrides:
  # Two copies of `effect` break Context / Layer / Schema identity.
  effect: "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]
skills:
  dirs: [.claude/skills]
peerDependencyRules:
  allowedVersions:
    # docgen's `tsconfck` never calls the API that needs this optional peer.
    "tsconfck>typescript": "6"

# Hold new versions for 24 hours; Dependabot's cooldown matches it.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
# Vite+ selects Node.js (.node-version) and pnpm (packageManager); pnpm
# must not download or switch to its own.
runtimeOnFail: ignore
pmOnFail: ignore
# docgen runs its examples with `tsx`, which scripts/bin/tsx stands in for
# (through vpx), so its `tsx` peer is optional and never installed.
packageExtensions:
  "@effect/docgen":
    peerDependenciesMeta:
      tsx:
        optional: true
