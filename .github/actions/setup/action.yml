# Composite setup shared by every CI job that needs the toolchain.
# Sets up Node.js + pnpm, restores the pnpm store cache (keyed on
# pnpm-lock.yaml by setup-node), and installs dependencies with a frozen
# lockfile (retried — see the Install step's own comment for why).
# `vp`, `tsx` and the other dev bins land in node_modules/.bin, which this
# adds to PATH. Copied from the gardeneria application.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Node.js and pnpm, restore the package cache, and install dependencies.
inputs:
  ignore-scripts:
    description: >-
      "true" installs with `--ignore-scripts`: no dependency lifecycle script
      and not the workspace's own `prepare`. Only the Release job sets it,
      because it holds `id-token: write`; CI keeps scripts on
      (the type gate needs the Effect-patched `tsc` that `prepare` produces).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # pnpm before Node so setup-node's `cache: pnpm` can resolve the store path.
    # The pnpm version comes from the `packageManager` field in package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: latest
        cache: pnpm

    # Retried up to three times, as a mitigation (not a fix) for a transient
    # ENOENT race in pnpm's linker seen in gardeneria CI (gardeneria#1192).
    # `pnpm install` is idempotent, so a deterministic failure (lockfile drift,
    # a policy violation) still fails all three attempts. `--frozen-lockfile`
    # and the scripts policy apply on every attempt. The Release job's
    # `ignore-scripts` is a separate security decision (see the input).
    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        flags=(--frozen-lockfile)
        if [ "$IGNORE_SCRIPTS" = "true" ]; then
          flags+=(--ignore-scripts)
        fi
        for attempt in 1 2 3; do
          if pnpm install "${flags[@]}"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
        echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
