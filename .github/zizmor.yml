# `uvx zizmor --offline .github` should report nothing beyond what is configured here.
rules:
  dependabot-cooldown:
    config:
      days: 1
  adhoc-packages:
    ignore:
      # The publish job installs one exactly pinned npm for the OIDC exchange.
      - release.yml
  # Exact tags; .github/workflows/actions.lock pins each to its commit.
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
