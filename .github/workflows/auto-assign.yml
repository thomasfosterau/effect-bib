name: Auto-assign

# Assigns the owner to every pull request that has no assignee. Runs on
# `pull_request`, never `pull_request_target`: nothing from the PR is checked
# out or executed, and the token is the workflow's own. A fork PR's token is
# read-only, so the step fails there rather than gaining write access.
# Dependabot's PRs are assigned through `assignees` in .github/dependabot.yml.
# A PR opened with the default GITHUB_TOKEN (the Release workflow's version
# PR) does not trigger workflows at all, so it is not assigned here.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  assign:
    if: github.actor != 'dependabot[bot]' && toJSON(github.event.pull_request.assignees) == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign the owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
