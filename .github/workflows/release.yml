name: Release

# Changesets, split so only `publish` holds `id-token: write` and waits for
# approval in the protected `release` environment. See docs/PUBLISHING.md.

on:
  push:
    branches: [trunk]

permissions: {}

jobs:
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-bib' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env: &env # Otherwise pnpm 11 may re-install with lifecycle scripts before `pnpm run`.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env: *env
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Create or update the version PR
        id: version
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
      - name: Assign the owner to the version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --add-assignee thomasfosterau

  publish:
    name: Publish to npm
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      id-token: write
    env: *env
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      # Trusted publishing needs npm >= 11.5.1; pinned exactly, bumped by hand.
      - name: Upgrade npm
        run: npm install -g npm@11.20.0
      - name: Build
        run: vp run -r build
      - name: Publish to npm
        uses: changesets/action/publish@v2.1.2
        with:
          script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
