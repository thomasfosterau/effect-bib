name: Release

# Changesets release flow, copied from the effect-jsonapi library: on every
# push to `main`, changesets/action either opens/updates the "Version
# Packages" PR (when unreleased changesets exist) or, when that PR has merged
# and no changesets remain, publishes every package under packages/* to npm
# via OIDC trusted publishing and tags the release. There is no NPM_TOKEN —
# see PUBLISHING.md for the one-time setup and SECURITY.md for the rationale.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    if: github.repository == 'thomasfosterau/reference-manager'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11's verify-deps-before-run would otherwise re-install WITH
      # lifecycle scripts before `pnpm run version` / `release` once a manifest
      # looks newer than the install, defeating `ignore-scripts` below in a job
      # holding `id-token: write`. Only the `pnpm_config_*` spelling is read.
      # See PUBLISHING.md ("No scripts in the release job").
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No lifecycle scripts in the id-token job: a compromised dependency's
      # install hook cannot run here, and the unpatched `tsc` emits the same
      # `dist/`. See PUBLISHING.md ("No scripts in the release job").
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: "true"

      # npm >= 11.5.1 performs the OIDC exchange for `npm publish`. Pinned
      # exactly (not `@latest`) so this id-token job runs a reviewed version;
      # bump it by hand — Dependabot does not see it. See PUBLISHING.md.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11.20.0

      - name: Build
        run: vp run -r build

      # Opens/updates the "Version Packages" PR while changesets are pending;
      # once it has merged, runs `pnpm run release` (scripts/release.sh) and
      # pushes the tags `changeset tag` reports. Never force provenance: an
      # explicit request fails the publish from a private repository (see
      # PUBLISHING.md). v2 of the action pairs with Changesets CLI v3.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
