name: Release

# Changesets release flow, split so that only publishing waits for approval.
# On every push to `trunk`:
#
# - `select` (read-only) asks changesets/action/select-mode what the repo state
#   calls for: `version` while unreleased changesets exist, `publish` once none
#   remain and some package version is not on npm yet (`changeset
#   publish-plan`), else `none`.
# - `version` opens/updates the "chore: version packages" PR. It holds a
#   write-scoped token but no `id-token`, so it cannot publish, and runs outside
#   the `release` environment, so it needs no approval.
# - `publish` is the only job in the protected `release` environment and the
#   only one with `id-token: write`: it publishes to npm via OIDC trusted
#   publishing and tags the release, after the owner approves it (once per
#   release). See PUBLISHING.md.
#
# changesets/action's README recommends its sub-actions over the combined
# action for trusted publishing, "to tighten publish permissions"; they need
# Changesets CLI v3. The version and publish sub-actions push through the
# GitHub API, so no checkout keeps git credentials.

on:
  push:
    branches: [trunk]

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Same setup as `publish` (see the comments there), minus the build.
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-bib' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env: &id001
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env: *id001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Create or update the version PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish to npm
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    # Nor for a Dependabot-authored push: this job holds `id-token: write`.
    # That guard is on `select` now: this job needs it, so it is skipped with it.
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One publish at a time; never cancel one that has started.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the release tags and create the GitHub releases
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11's verify-deps-before-run would otherwise re-install WITH
      # lifecycle scripts before `pnpm run version` / `release` once a manifest
      # looks newer than the install, defeating `ignore-scripts` below in a job
      # holding `id-token: write`. Only the `pnpm_config_*` spelling is read.
      # See PUBLISHING.md ("No scripts in the release job").
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No lifecycle scripts in the id-token job: a compromised dependency's
      # install hook cannot run here, and the unpatched `tsc` emits the same
      # `dist/`. See PUBLISHING.md ("No scripts in the release job").
      # Node 24 LTS: its bundled npm is 11.x; the upgrade step below pins the
      # exact npm (>= 11.5.1 is needed for the OIDC exchange).
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: 24
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]

      # npm >= 11.5.1 performs the OIDC exchange for `npm publish`. Pinned
      # exactly (not `@latest`) so this id-token job runs a reviewed version;
      # bump it by hand — Dependabot does not see it. See PUBLISHING.md.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11.20.0

      - name: Build
        run: vp run -r build

      # Once the version PR has merged, runs `pnpm run release`
      # (scripts/release.sh) and pushes the tags `changeset tag` reports. Never
      # force provenance: an explicit request fails the publish from a private
      # repository (see PUBLISHING.md). v2 of the action pairs with Changesets
      # CLI v3.
      - name: Publish to npm
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
