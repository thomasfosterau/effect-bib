name: Effect Canary

# Runs the gate against the newest Effect release (the "latest" npm dist-tag)
# instead of the version pinned in pnpm-workspace.yaml / pnpm-lock.yaml, so
# upstream breakage surfaces here on a schedule rather than in a consumer's
# build. Copied from the effect-jsonapi library and adapted to the strict
# pnpm catalog: the float is a rewrite of the catalog's `effect` pin (a
# `pnpm add effect@latest` is rejected under `catalogMode: strict`).
#
# Scheduled + manual only — this never runs on push or pull_request, so a red
# run can never block a PR merge. The job still finishes red in the Actions
# tab (see the final step) and files/refreshes a GitHub issue, because nobody
# watches the Actions tab for a weekly cron.
on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: effect-canary-${{ github.ref }}
  cancel-in-progress: true

# No permissions by default; the single job grants only what it needs.
permissions: {}

jobs:
  canary:
    name: Typecheck, test & docgen against effect@latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # to file/refresh the failure-notification issue
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Baseline install against the committed lockfile (retried; see the
      # action's own comment).
      - uses: ./.github/actions/setup

      # Float the catalog's `effect` pin onto the newest Effect release (the
      # "latest" dist-tag). Effect 4.0.0 is stable, so the "rc" tag this
      # used to follow no longer moves, and floating onto it would re-test
      # (or, once the catalog is past it, downgrade below) the pin. Switch
      # the tag if the project starts tracking a prerelease line again. The
      # rewrite is scoped to the top-level `catalog:` block so the
      # `effect: "catalog:"` override (same indentation) is left alone; that
      # override then carries the float to every resolution, and the step
      # fails if the catalog entry was not rewritten. The TypeScript 6/7 pair
      # and @effect/tsgo stay pinned (they move only as a set).
      # `minimumReleaseAge` is lifted for this one install: the point is the
      # version published this week.
      - name: Install latest Effect release
        run: |
          set -euo pipefail
          latest="$(npm view effect@latest version)"
          echo "floating effect to ${latest}"
          sed -i -E "/^catalog:$/,/^[^ #]/ s/^(  effect: ).*$/\1${latest}/" pnpm-workspace.yaml
          grep -qx "  effect: ${latest}" pnpm-workspace.yaml || {
            echo "::error::the catalog's effect entry was not rewritten to ${latest}"
            exit 1
          }
          grep -E '^  effect: ' pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      # The three checks most likely to catch an Effect API/behavior break.
      # Lint and formatting are deliberately skipped: they have nothing to do
      # with the Effect version and would only add unrelated noise to a
      # canary result. Each step runs even if an earlier one fails, so a
      # single run reports typecheck/test/docgen status independently.
      - name: Type-check (incl. type-level tests and emitted declarations)
        id: typecheck
        continue-on-error: true
        run: vp run --concurrency-limit 2 check

      - name: Test
        id: test
        continue-on-error: true
        run: vp run -r test:unit

      # Type-checks AND runs every JSDoc @example against the new Effect version.
      - name: Verify documentation examples (docgen)
        id: docgen
        continue-on-error: true
        run: vp run -r docgen

      - name: Open or refresh an issue if the canary is red
        if: |
          steps.typecheck.outcome == 'failure' ||
          steps.test.outcome == 'failure' ||
          steps.docgen.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          DOCGEN_OUTCOME: ${{ steps.docgen.outcome }}
        run: |
          set -euo pipefail

          title="Effect canary is red against effect@latest"

          body=$(jq -n \
            --arg run "$RUN_URL" \
            --arg typecheck "$TYPECHECK_OUTCOME" \
            --arg test "$TEST_OUTCOME" \
            --arg docgen "$DOCGEN_OUTCOME" \
            '"The scheduled Effect canary failed against the latest `effect` release (the `latest` npm dist-tag).\n\n" +
             "- typecheck: " + $typecheck + "\n" +
             "- test: " + $test + "\n" +
             "- docgen: " + $docgen + "\n\n" +
             "Run: " + $run + "\n\n" +
             "This does not block any PR by itself — it means the newest Effect release breaks this library against its pinned version. Investigate the run, then either fix the break before moving the catalog pin or close this out if it turns out to be a fluke in that release."')

          existing=$(curl -sS -G \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "q=repo:$REPO type:issue state:open in:title \"$title\"" \
            "https://api.github.com/search/issues" | jq -r '.items[0].number // empty')

          if [ -n "$existing" ]; then
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$existing/comments" \
              -d "{\"body\": $body}"
          else
            payload=$(jq -n --arg title "$title" --argjson body "$body" '{title: $title, body: $body}')
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues" \
              -d "$payload"
          fi

      # continue-on-error above keeps the job running through all three
      # checks so the issue body above has full information; this step turns
      # that into a real (visible, red) job failure once we're done.
      - name: Fail the job if any check failed
        if: |
          steps.typecheck.outcome == 'failure' ||
          steps.test.outcome == 'failure' ||
          steps.docgen.outcome == 'failure'
        run: exit 1
