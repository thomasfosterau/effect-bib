name: CI

# ONE job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the root `check` task), not in GitHub Actions `needs:`.
# Copied in shape from the effect-drizzle-ext library (itself from the
# gardeneria application), minus that library's database service: nothing
# here needs one — the lookup sources are exercised against a stubbed
# `FetchHttpClient`, never the network.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only what it needs. CI
# needs no secret and no OIDC token, so a Dependabot PR runs it safely.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `cache: true` restores the pnpm store (keyed on pnpm-lock.yaml); the
      # `vite-plus` pin comes from the catalog. Never `latest` for Node: `lts`
      # is the newest LTS line (a pre-release can be `latest`). The install is
      # frozen and keeps lifecycle scripts on (the type gate needs the
      # Effect-patched `tsc` that `prepare` produces).
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      - name: Format and lint
        run: vp check
      # Build first, as its own step. `check` (through the dist-consumer
      # check) and `test:coverage` each depend on `build` as well, so neither
      # can run against a missing dist/ (#22).
      - name: Build
        run: vp run -r build
      - name: Type gates (package, type-level tests, emitted declarations)
        run: vp run --concurrency-limit 2 check
      # `test:coverage`, not `test:unit` (#49): the same tests, plus two gates
      # the plain run lacks. vite-plus's `test --coverage` guard throws unless
      # `@vitest/coverage-istanbul` equals its bundled `vitest` exactly (#47),
      # and the coverage thresholds in packages/effect-bib/vite.config.ts fail the
      # step on a drop (#50).
      # Pandoc's BibLaTeX test cases for the BibTeX oracle (#91): GPL, so
      # fetched at a pinned commit rather than vendored.
      - name: Fetch the oracle corpora
        run: vp run --filter ./packages/effect-bib oracles:fetch
      - name: Unit tests + coverage
        run: vp run -r test:coverage
      # Type-checks AND runs every JSDoc @example.
      - name: Verify documentation examples (docgen)
        run: vp run -r docgen
      - name: Audit
        run: pnpm audit --audit-level high
