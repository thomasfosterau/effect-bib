# Dependabot version-update configuration.
#
# The `npm` ecosystem at `/` reads the pnpm workspace, its catalogs and
# pnpm-lock.yaml, so a bump lands as a catalog edit plus a lockfile update.
#
# `groups` collect the sets that MUST move together, so no member can drift
# from the rest in a PR of its own. Dependabot puts a dependency in the FIRST
# group whose patterns match, so the groups run specific → general, and
# `exclude-patterns` keep each package out of a group it would otherwise also
# match. Every catalog entry in pnpm-workspace.yaml belongs to exactly one:
#
# - `toolchain`: `vite-plus` pins the `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` it carries (and `vite` is its aliased core,
#   `@voidzero-dev/vite-plus-core`); the coverage provider must equal that
#   bundled `vitest` exactly (#47); `effect-tsgo patch` (the root `prepare`)
#   hard-errors on a `@typescript/native` (TS7) / `typescript` (the TS6 alias,
#   `@typescript/typescript6`) / oxlint pairing its release ships no artifact
#   for; and `@enfect/oxlint` (the Effect lint rules) runs inside that oxlint. One
#   PR, then, even for a major: read the `components` table in
#   node_modules/@effect/tsgo/dist/effect-tsgo.cjs and the version notes in
#   pnpm-workspace.yaml before merging it.
# - `docgen`: `@effect/docgen` runs every example under `tsx`.
# - `effect`: the Effect 4 release line is a lockstep-versioned singleton set
#   (the `effect` override in pnpm-workspace.yaml forces one copy). It also
#   carries `@effect/language-service`. `@effect/tsgo` and `@effect/docgen`
#   are excluded: they belong to the groups above.
# - `changesets`, `fallow`: each its own set.
# - `minor-and-patch`: everything else (`@types/node`,
#   `@thomasfosterau/effect-parse`), minor and patch only, so PR volume stays
#   low; a major outside the lockstep sets opens on its own.
#
# Hand moves, on the matching group's PR, because Dependabot cannot make them:
#
# - the npm-alias catalog entries: `vite` (`npm:@voidzero-dev/vite-plus-core`,
#   always equal to `vite-plus`; `pnpm exec vp migrate` re-pins it, then drop
#   the `minimumReleaseAgeExclude` entries it adds), `typescript`
#   (`npm:@typescript/typescript6`) and `@typescript/native`
#   (`npm:typescript`, a pairing `@effect/tsgo`'s `components` table lists);
# - `vitest` and `@vitest/coverage-istanbul` to the exact `vitest` the new
#   vite-plus pins;
# - an `@effect/tsgo` release that supports the new vite-plus's oxlint and
#   oxlint-tsgolint, when a toolchain PR fails `pnpm install`;
# - the `undici` security floor under `overrides` (drop it once the
#   resolution reaches the fix on its own). The other `overrides` (`vite@*`,
#   `vitest@*`, `effect`) point at `catalog:`, so a catalog bump moves them.
#
# The published peer range (`catalogs.peers.effect`) is a deliberate floor,
# not a version to chase: change it by hand, with a changeset.
#
# `cooldown` takes whole days only, so it is 1 day: longer than
# pnpm-workspace.yaml's `minimumReleaseAge` (480 minutes, 8 hours), so a
# Dependabot PR never proposes a version pnpm would still refuse. Same
# `@thomasfosterau/*` exemption as `minimumReleaseAgeExclude`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "@voidzero-dev/*"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@enfect/*"
        update-types: ["major", "minor", "patch"]
      docgen:
        applies-to: version-updates
        patterns:
          - "@effect/docgen"
          - "tsx"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/docgen"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
