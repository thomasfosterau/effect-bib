# Dependabot version-update configuration (a subset of the preferenceflow
# application's, whose catalog this workspace mirrors).
#
# `groups` collect dependencies that MUST move together: the Effect 4 release
# line is a lockstep-versioned singleton set.
#
# The vitest toolchain (`vite` / `vitest` / `vite-plus` /
# `@vitest/coverage-istanbul`) is a set too, but it has no group, because
# Dependabot never moves it: it is pinned to vite-plus's exact versions, so it
# moves only by hand, with a vite-plus release (see the `vite-plus` note in
# pnpm-workspace.yaml), and its version updates are ignored below. The
# coverage provider is in that set because vite-plus ships none and its `test
# --coverage` guard throws unless the provider equals its bundled `vitest`
# exactly (#47); a Dependabot bump of the provider alone breaks
# `test:coverage` while CI, which does not run it, stays green. Security
# updates stay enabled (the ignore is scoped to the `version-update:semver-*`
# update types), so a security PR touching `vitest`,
# `@vitest/coverage-istanbul` or `vite-plus` can still open: do NOT merge it
# alone. Moving one member skews the set off vite-plus's exact pins while CI
# stays green; take the fix by moving the whole set with a vite-plus release
# instead. A group with `applies-to: security-updates` would not help: it
# only combines members that are themselves vulnerable, so it never moves the
# rest of the set along.
#
# `@effect/tsgo`, `typescript` (the TS6 alias) and `@typescript/native` are a
# set too: `effect-tsgo patch` matches the native `tsc` and `oxlint` by gitHead
# / version and hard-errors (UnsupportedTargetPackageVersionError) on any
# pairing it ships no artifact for, so a Dependabot PR that moves one of them
# alone goes red. They move by hand, as a set with `vite-plus`, after reading
# the `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs (see
# the `@effect/tsgo` note in pnpm-workspace.yaml). Their version updates are
# ignored below and `@effect/tsgo` is excluded from the `effect` group; security
# updates stay enabled (same `version-update:semver-*` scoping).
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
    ignore:
      - dependency-name: "@effect/tsgo"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "typescript"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@typescript/native"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vitest"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@vitest/coverage-istanbul"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite-plus"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
