# Dependabot version-update configuration.
#
# The `npm` ecosystem at `/` reads the pnpm workspace, its catalogs and
# pnpm-lock.yaml, so a bump lands as a catalog edit plus a lockfile update.
#
# `groups` exist only for sets that MUST move together (exact cross-pins or a
# hard compatibility table), so updating one member alone breaks the install
# or the build; every other dependency gets its own PR. Dependabot puts a
# dependency in the FIRST group whose patterns match, so `exclude-patterns`
# keep a package out of a group it would otherwise also match:
#
# - `toolchain`: `vite-plus` pins the `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` it carries; the coverage provider must equal that bundled
#   `vitest` exactly (#47); `effect-tsgo patch` (the root `prepare`)
#   hard-errors on a TypeScript / oxlint pairing its release ships no
#   artifact for. One PR, then, even for a major: read the `components` table
#   in node_modules/@effect/tsgo/dist/effect-tsgo.cjs and the version notes in
#   pnpm-workspace.yaml before merging it. (`@enfect/oxlint` ranges its oxlint
#   plugin API, so it moves on its own.)
# - `effect`: the Effect 4 release line is a lockstep-versioned singleton set
#   (the `effect` override in pnpm-workspace.yaml forces one copy), with
#   `@effect/docgen`, which depends on `effect` and `@effect/platform-node` at
#   its own release (docgen 4.0.x crashes on effect 4.1: `effect/Crypto` is
#   gone). It also carries `@effect/language-service`. `@effect/tsgo` is
#   toolchain.
#
# Hand moves, on the matching group's PR, because Dependabot cannot make them:
#
# - the npm-alias catalog entries: `vite` (`npm:@voidzero-dev/vite-plus-core`,
#   always equal to `vite-plus`; `pnpm exec vp migrate` re-pins it, then drop
#   the `minimumReleaseAgeExclude` entries it adds), `typescript`
#   (`npm:@typescript/typescript6`) and `@typescript/native`
#   (`npm:typescript`, a pairing `@effect/tsgo`'s `components` table lists);
# - `vitest` and `@vitest/coverage-istanbul` to the exact `vitest` the new
#   vite-plus pins;
# - an `@effect/tsgo` release that supports the new vite-plus's oxlint and
#   oxlint-tsgolint, when a toolchain PR fails `pnpm install`;
# - the `undici` security floor under `overrides` (drop it once the
#   resolution reaches the fix on its own). The other `overrides` (`vite@*`,
#   `vitest@*`, `effect`) point at `catalog:`, so a catalog bump moves them.
#
# The published peer range (`catalogs.peers.effect`) is a deliberate floor,
# not a version to chase: change it by hand, with a changeset.
#
# Every entry assigns the owner (`assignees`): the Auto-assign workflow skips
# Dependabot's PRs, so this is how they are assigned.
#
# `cooldown` takes whole days only, so it is 1 day: longer than
# pnpm-workspace.yaml's `minimumReleaseAge` (480 minutes, 8 hours), so a
# Dependabot PR never proposes a version pnpm would still refuse. Same
# `@thomasfosterau/*` exemption as `minimumReleaseAgeExclude`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    assignees:
      - "thomasfosterau"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      # vite-plus pins vitest/oxlint exactly; @effect/tsgo's patch supports only listed oxlint versions.
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
        update-types: ["major", "minor", "patch"]
      # One release train; @effect/docgen runs on effect/@effect/platform-node at its own release.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
        update-types: ["major", "minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    assignees:
      - "thomasfosterau"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
  # The Dev Container features in .devcontainer/devcontainer.json. No group:
  # each feature updates on its own PR. The image tag is a hand move (it
  # follows the catalog's `vite-plus` pin; see the comment beside it).
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    assignees:
      - "thomasfosterau"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
